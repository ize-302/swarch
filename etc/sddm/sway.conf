# Installed to /etc/sddm/ by install.sh. The sway that SDDM's login screen
# (config/sddm/themes/custom) runs in, as the sddm user, instead of an X
# server: SDDM stops it once you log in, where an X server stayed running for
# the whole session. It lays the outputs out side by side on its own.

# At 1, as X had them: QT_SCREEN_SCALE_FACTORS (GreeterEnvironment) scales the
# greeter instead, and sway's own guess for a HiDPI panel would add to it
output * scale 1

# Only the greeter's windows, fullscreen on their own outputs
xwayland disable
default_border none
default_floating_border none

seat * xcursor_theme Adwaita 24

input type:touchpad {
    tap enabled
    natural_scroll enabled
}
