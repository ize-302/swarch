; Tokyo Night, flat and square: matches waybar + the launcher/power menu.
; Accent colours are the icon squares from the power menu.

[General]
scale = 1.0
enable-animations = true

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background-color = "#15161e"
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "center"
align = "center"
format = "hh:mm"
font-family = "JetBrainsMono NF"
font-size = 70
font-weight = 700
color = "#c0caf5"

[LockScreen.Date]
display = true
format = "ddd dd MMM"
locale = "en_US"
font-family = "JetBrainsMono NF"
font-size = 14
font-weight = 500
color = "#4caf50"
margin-top = -5

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "JetBrainsMono NF"
font-size = 16
font-weight = 500
color = "#565f89"

[LoginScreen]
background-color = "#15161e"

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "square"
border-radius = 0
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#414868"
inactive-border-color = "#414868"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono NF"
font-size = 16
font-weight = 500
color = "#c0caf5"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 220
height = 34
display-icon = true
font-family = "JetBrainsMono NF"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#c0caf5"
background-color = "#1a1b26"
background-opacity = 1.0
border-size = 0
border-color = "#414868"
border-radius-left = 0
border-radius-right = 0
margin-top = 10
masked-character = "●"
masked-character-spacing = 5

[LoginScreen.LoginArea.LoginButton]
background-color = "#4caf50"
background-opacity = 1.0
active-background-color = "#66bb6a"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#ffffff"
active-content-color = "#ffffff"
border-size = 0
border-color = "#414868"
border-radius-left = 0
border-radius-right = 0
margin-left = 0
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "JetBrainsMono NF"
font-size = 12
font-weight = 500

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "waking the penguin"
font-family = "JetBrainsMono NF"
font-weight = 500
font-size = 14
icon-size = 30
color = "#4caf50"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono NF"
font-size = 11
font-weight = 400
normal-color = "#a9b1d6"
warning-color = "#ff9800"
error-color = "#f44336"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 100
margin-left = 0
size = 46
border-radius = 0
spacing = 0
font-family = "JetBrainsMono NF"

[LoginScreen.MenuArea.Popups]
max-height = 230
item-height = 38
item-spacing = 0
padding = 0
display-scrollbar = false
margin = 0
background-color = "#1a1b26"
background-opacity = 1.0
active-option-background-color = "#292e42"
active-option-background-opacity = 1.0
content-color = "#c0caf5"
active-content-color = "#c0caf5"
font-family = "JetBrainsMono NF"
border-size = 0
border-color = "#414868"
font-size = 11
icon-size = 20

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = false
button-width = -1
popup-width = 200
background-color = "#1a1b26"
active-background-color = "#292e42"
background-opacity = 1.0
active-background-opacity = 1.0
content-color = "#565f89"
active-content-color = "#c0caf5"
border-size = 0
font-size = 10
icon-size = 22

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-center"
index = 0
background-color = "#1a1b26"
active-background-color = "#292e42"
background-opacity = 1.0
active-background-opacity = 1.0
content-color = "#565f89"
active-content-color = "#c0caf5"
border-size = 0
icon = "keyboard.svg"
icon-size = 22

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 140
background-color = "#1a1b26"
active-background-color = "#292e42"
background-opacity = 1.0
active-background-opacity = 1.0
content-color = "#565f89"
active-content-color = "#c0caf5"
border-size = 0
icon = "power.svg"
icon-size = 22

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#1a1b26"
background-opacity = 1.0
key-content-color = "#c0caf5"
key-color = "#292e42"
key-opacity = 1.0
key-active-background-color = "#414868"
key-active-opacity = 1.0
selection-background-color = "#c0caf5"
selection-content-color = "#15161e"
primary-color = "#00bcd4"
border-size = 0
border-color = "#414868"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "JetBrainsMono NF"
font-size = 11
content-color = "#b1b1b1"
background-color = "#1a1b26"
background-opacity = 1.0
border-radius = 0
disable-user = false
disable-login-button = false
